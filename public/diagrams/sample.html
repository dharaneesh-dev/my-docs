<!doctype html>
<html><head><meta charset="utf-8"/><title>Sample Diagram</title>
<style>
  html,body{margin:0;height:100%;background:#fff;color:#202124;font-family:"Google Sans","Roboto",system-ui,sans-serif;}
  .wrap{height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;}
  svg{width:100%;max-width:880px;height:auto;}
  text{font-family:"Google Sans","Roboto",system-ui,sans-serif;fill:#202124;font-size:13px;}
  .node{fill:#e8f0fe;stroke:#1a73e8;stroke-width:1.2;}
  .edge{stroke:#5f6368;stroke-width:1.2;fill:none;marker-end:url(#arrow);}
  .label{fill:#1a73e8;font-weight:500;font-size:12px;letter-spacing:.04em;text-transform:uppercase;}
</style></head>
<body><div class="wrap"><svg viewBox="0 0 800 320">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
  <text class="label" x="400" y="20" text-anchor="middle">Sample architecture — replace with a Draw.io export</text>
  <rect class="node" x="20" y="120" width="140" height="80" rx="8"/><text x="90" y="165" text-anchor="middle">Source</text>
  <rect class="node" x="220" y="40" width="160" height="80" rx="8"/><text x="300" y="85" text-anchor="middle">Preprocess</text>
  <rect class="node" x="220" y="200" width="160" height="80" rx="8"/><text x="300" y="245" text-anchor="middle">Validate</text>
  <rect class="node" x="440" y="120" width="160" height="80" rx="8"/><text x="520" y="165" text-anchor="middle">Inference</text>
  <rect class="node" x="640" y="120" width="140" height="80" rx="8"/><text x="710" y="165" text-anchor="middle">Sink</text>
  <path class="edge" d="M160 150 Q200 80 220 80"/><path class="edge" d="M160 170 Q200 240 220 240"/>
  <path class="edge" d="M380 80 Q420 150 440 150"/><path class="edge" d="M380 240 Q420 170 440 160"/>
  <path class="edge" d="M600 160 L640 160"/>
</svg></div></body></html>
